services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-pay-postgres-dev
    environment:
      POSTGRES_DB: agent-pay-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - agent-pay-app_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent-pay-redis-dev
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'always',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - agent-pay-app_redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  upstash-redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: agent-pay-upstash-redis-http-dev
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: agent-pay-local-redis
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:8079:80'
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: agent-pay-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - agent-pay-app_minio_data_dev:/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: agent-pay-tunnel
    command: tunnel --metrics 0.0.0.0:20241 --url http://host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:20241:20241'
    restart: unless-stopped

volumes:
  agent-pay-app_postgres_data_dev:
  agent-pay-app_redis_data_dev:
  agent-pay-app_minio_data_dev:
